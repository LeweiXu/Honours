<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multi-Page Visually Rich Documents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ================= SHARED CHROME =================
     Identical in every slide file. build.py lifts this block off slide 1, so
     edit it here and it propagates to the deck on the next build.

     A slide carries three things and nothing else: its title, its content, and
     a corner marker giving the slide number and the section. */
  :root{
    --paper:#FFFFFF;
    --ink:#14181C;
    --slate:#5F6A75;
    --mute:#8C959E;
    --line:#E2E6EA;
    --navy:#1F4E79;
    --wash:#E9EFF5;
    --disp:'Instrument Sans',sans-serif;
    --body:'Inter',sans-serif;
    --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:#ccd2d8;
    font-family:var(--body); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- slide frame: fixed 16:9 ---- */
  .slide{
    width:1280px; height:720px; background:var(--paper);
    position:relative; overflow:hidden;
    display:flex; flex-direction:column;
    padding:56px 64px 62px;
    box-shadow:0 20px 52px rgba(20,24,28,.20);
  }

  h1{
    font-family:var(--disp); font-weight:600; font-size:38px;
    letter-spacing:-.022em; line-height:1.1;
  }

  /* ---- the content region: everything below the title ---- */
  .body{flex:1; padding-top:34px; min-height:0;}

  /* ---- corner marker: slide number and section ---- */
  .corner{
    position:absolute; right:64px; bottom:26px;
    font-family:var(--mono); font-size:11px; font-weight:400;
    letter-spacing:.05em; color:var(--mute);
  }
  .corner b{color:var(--navy); font-weight:600;}
  .corner span{padding:0 7px;}

  /* ================= SLIDE 15 ================= */
  .s15 .lab{font-family:var(--mono); font-size:12.5px; font-weight:500; letter-spacing:.09em; text-transform:uppercase; color:var(--navy); margin-bottom:16px; white-space:nowrap;}
  .s15 .lab span{color:var(--mute); font-weight:400; letter-spacing:.03em; text-transform:none; margin-left:12px;}
  .s15 .cap{font-family:var(--mono); font-size:11.5px; letter-spacing:.03em; color:var(--mute); line-height:1.5; margin-top:9px;}
  .s15 .cap b{color:var(--ink); font-weight:500;}
  .s15 img{display:block; border:1px solid var(--line);}
  .s15 .src{position:absolute; left:64px; bottom:26px; font-family:var(--mono); font-size:11px; letter-spacing:.05em; color:var(--mute);}
  .s15 .pic{position:relative;}
  .s15 .pic img{width:100%; height:auto;}
  .s15 .hl{position:absolute; border:2px solid var(--navy);}
  .s15 .hl em{position:absolute; left:-2px; top:-20px; background:var(--navy); color:#fff; font-family:var(--mono); font-style:normal; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; padding:3px 7px; white-space:nowrap;}
  .s15 .hl em.br{left:auto; top:auto; right:-2px; bottom:-2px;}
  .s15 .cols{display:grid; grid-template-columns:352px 1fr; gap:56px;}
  .s15 .zoom img{width:430px; height:auto;}
  .s15 .zoom img.n{width:300px;}
  .s15 .zoom .cap{margin:0 0 7px;}
  .s15 .zoom img + .cap{margin-top:16px;}

  /* ---------- PRINT: one landscape page per slide ---------- */
  @page{ size:1280px 720px; margin:0; }
  @media print{
    body{background:#fff; display:block;}
    .slide{box-shadow:none; width:1280px; height:720px; page-break-after:always;}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }
</style>
</head>
