<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multi-Page Visually Rich Document Understanding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ================= SHARED CHROME =================
     Identical in every slide file. build.py lifts this block off slide 1, so
     edit it here and it propagates to the deck on the next build.

     A slide carries three things and nothing else: its title, its content, and
     a corner marker giving the slide number and the section. */
  :root{
    --paper:#FFFFFF;
    --ink:#14181C;
    --slate:#14181C;
    --mute:#14181C;
    --line:#E2E6EA;
    --navy:#1F4E79;
    --wash:#E9EFF5;
    --disp:'Instrument Sans',sans-serif;
    --body:'Inter',sans-serif;
    --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:#ccd2d8;
    font-family:var(--body); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- slide frame: fixed 16:9 ---- */
  .slide{
    width:1280px; height:720px; background:var(--paper);
    position:relative; overflow:hidden;
    display:flex; flex-direction:column;
    padding:56px 64px 62px;
    box-shadow:0 20px 52px rgba(20,24,28,.20);
  }

  h1{
    font-family:var(--disp); font-weight:600; font-size:38px;
    letter-spacing:-.022em; line-height:1.1;
  }

  /* ---- the content region: everything below the title ---- */
  .body{flex:1; padding-top:34px; min-height:0;}

  /* ---- corner marker: slide number and section ---- */
  .corner{
    position:absolute; right:64px; bottom:26px;
    font-family:var(--mono); font-size:11px; font-weight:400;
    letter-spacing:.05em; color:var(--mute);
  }
  .corner b{color:var(--ink); font-weight:600;}
  .corner span{padding:0 7px;}

  /* ================= SLIDE 1: title ================= */
  .s1{justify-content:center;}

  .s1 .eyebrow{
    font-family:var(--mono); font-size:11px; font-weight:500;
    letter-spacing:.2em; text-transform:uppercase; color:var(--ink);
    margin-bottom:22px;
  }
  .s1 .ttl{
    font-family:var(--disp); font-weight:600; font-size:54px;
    letter-spacing:-.028em; line-height:1.06;
  }
  .s1 .sub{
    margin-top:20px; font-size:20px; font-weight:400; line-height:1.45;
    color:var(--slate);
  }
  .s1 .cut{width:96px; height:2px; background:var(--navy); margin:38px 0 28px;}
  .s1 .who{
    font-family:var(--disp); font-size:21px; font-weight:500; letter-spacing:-.01em;
  }
  .s1 .sup{
    margin-top:10px; font-family:var(--mono); font-size:12px;
    letter-spacing:.04em; color:var(--slate);
  }
  .s1 .sup em{font-style:normal; color:var(--ink); padding:0 7px;}

  /* ---------- PRINT: one landscape page per slide ---------- */
  @page{ size:1280px 720px; margin:0; }
  @media print{
    body{background:#fff; display:block;}
    .slide{box-shadow:none; width:1280px; height:720px; page-break-after:always;}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }
</style>
</head>
<body>

<div class="slide s1">

  <div class="eyebrow">Final Seminar &middot; October 2026</div>
  <div class="ttl">Multi-Page Visually Rich<br>Document Understanding</div>
  <div class="sub">A survey of system design and an empirical attribution of failure</div>

  <div class="cut"></div>

  <div class="who">Lewei Xu</div>
  <div class="sup">Supervised by Dr. Yihao Ding <em>&middot;</em> Dr. Daochang Liu</div>

</div>
</body>
</html>
