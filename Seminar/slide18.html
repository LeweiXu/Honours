<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multi-Page Visually Rich Documents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ================= SHARED CHROME =================
     Identical in every slide file. build.py lifts this block off slide 1, so
     edit it here and it propagates to the deck on the next build.

     A slide carries three things and nothing else: its title, its content, and
     a corner marker giving the slide number and the section. */
  :root{
    --paper:#FFFFFF;
    --ink:#14181C;
    --slate:#14181C;
    --mute:#14181C;
    --line:#E2E6EA;
    --navy:#1F4E79;
    --wash:#E9EFF5;
    --disp:'Instrument Sans',sans-serif;
    --body:'Inter',sans-serif;
    --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:#ccd2d8;
    font-family:var(--body); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- slide frame: fixed 16:9 ---- */
  .slide{
    width:1280px; height:720px; background:var(--paper);
    position:relative; overflow:hidden;
    display:flex; flex-direction:column;
    padding:56px 64px 62px;
    box-shadow:0 20px 52px rgba(20,24,28,.20);
  }

  h1{
    font-family:var(--disp); font-weight:600; font-size:38px;
    letter-spacing:-.022em; line-height:1.1;
  }

  /* ---- the content region: everything below the title ---- */
  .body{flex:1; padding-top:34px; min-height:0;}

  /* ---- corner marker: slide number and section ---- */
  .corner{
    position:absolute; right:64px; bottom:26px;
    font-family:var(--mono); font-size:11px; font-weight:400;
    letter-spacing:.05em; color:var(--mute);
  }
  .corner b{color:var(--ink); font-weight:600;}
  .corner span{padding:0 7px;}

  /* ================= SLIDE 18 ================= */
  .s18 .lab{font-family:var(--mono); font-size:12.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; margin-bottom:10px;}
  .s18 .sub{font-family:var(--disp); font-size:25px; font-weight:600; letter-spacing:-.015em; line-height:1.25;}
  .s18 ul{list-style:none;}
  .s18 ul li{position:relative; padding-left:26px; margin-bottom:16px; font-size:19.5px; line-height:1.45;}
  .s18 ul li::before{content:""; position:absolute; left:0; top:13px; width:11px; height:2px; background:var(--navy);}
  .s18 ul li:last-child{margin-bottom:0;}
  .s18 b{font-weight:600;}
  .s18 img{display:block;}
  .s18 .body{display:flex; flex-direction:column; justify-content:center; padding-top:0;}
  .s18 .big{font-family:var(--disp); font-size:76px; font-weight:600; letter-spacing:-.03em; line-height:1;}
  .s18 .cut{width:96px; height:2px; background:var(--navy); margin:38px 0 28px;}
  .s18 .q{font-size:26px;}

  /* ---------- PRINT: one landscape page per slide ---------- */
  @page{ size:1280px 720px; margin:0; }
  @media print{
    body{background:#fff; display:block;}
    .slide{box-shadow:none; width:1280px; height:720px; page-break-after:always;}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }
</style>
</head>
<body>

<div class="slide s18">

  <div class="body">
    <div class="big">Thank you</div>
    <div class="cut"></div>
    <div class="q">Questions?</div>
  </div>

  <div class="corner"><b>18</b> / 18 <span>&middot;</span> Conclusion</div>

</div>
</body>
</html>
