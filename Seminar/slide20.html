<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multi-Page Visually Rich Documents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ================= SHARED CHROME =================
     Identical in every slide file. build.py lifts this block off slide 1, so
     edit it here and it propagates to the deck on the next build.

     A slide carries three things and nothing else: its title, its content, and
     a corner marker giving the slide number and the section. */
  :root{
    --paper:#FFFFFF;
    --ink:#14181C;
    --slate:#14181C;
    --mute:#14181C;
    --line:#E2E6EA;
    --navy:#1F4E79;
    --red:#B42318;
    --wash:#E9EFF5;
    --disp:'Instrument Sans',sans-serif;
    --body:'Inter',sans-serif;
    --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:#ccd2d8;
    font-family:var(--body); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- slide frame: fixed 16:9 ---- */
  .slide{
    width:1280px; height:720px; background:var(--paper);
    position:relative; overflow:hidden;
    display:flex; flex-direction:column;
    padding:56px 64px 62px;
    box-shadow:0 20px 52px rgba(20,24,28,.20);
  }

  h1{
    font-family:var(--disp); font-weight:600; font-size:38px;
    letter-spacing:-.022em; line-height:1.1;
  }

  /* ---- the content region: everything below the title ---- */
  .body{flex:1; padding-top:34px; min-height:0;}

  /* ---- corner marker: slide number and section ---- */
  .corner{
    position:absolute; right:64px; bottom:26px;
    font-family:var(--mono); font-size:11px; font-weight:400;
    letter-spacing:.05em; color:var(--mute);
  }
  .corner b{color:var(--ink); font-weight:600;}
  .corner span{padding:0 7px;}

  /* ---- highlight colour, annotation boxes, and the section tracker in the corner ---- */
  .hi{color:var(--red); font-weight:600; font-style:normal;}
  .pic{position:relative; flex:none;}
  .pic img{width:100%; height:100%; display:block;}
  .box{position:absolute; border:2.5px solid var(--red); border-radius:3px;}
  .corner i{font-style:normal; margin-right:14px; opacity:.32;}
  .corner i.on{opacity:1; font-weight:600;}
  .corner i:last-of-type{margin-right:26px;}

  /* ================= SLIDE 20 ================= */
  .s20 .lab{font-family:var(--mono); font-size:12.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; margin-bottom:10px;}
  .s20 .sub{font-family:var(--disp); font-size:25px; font-weight:600; letter-spacing:-.015em; line-height:1.25;}
  .s20 ul{list-style:none;}
  .s20 ul li{position:relative; padding-left:26px; margin-bottom:16px; font-size:19.5px; line-height:1.45;}
  .s20 ul li::before{content:""; position:absolute; left:0; top:13px; width:11px; height:2px; background:var(--navy);}
  .s20 ul li:last-child{margin-bottom:0;}
  .s20 b{font-weight:600;}
  .s20 img{display:block;}
  .s20 .lead{font-size:20px; line-height:1.45; max-width:1120px;}
  .s20 .cols{display:grid; grid-template-columns:580px 1fr; gap:44px; align-items:start;}
  .s20 .sub{margin-bottom:22px;}
  .s20 .strip{display:flex; align-items:stretch; gap:0; margin-bottom:24px;}
  .s20 .strip > div{flex:1; border:1.5px solid var(--line); padding:8px 10px 9px; position:relative;}
  .s20 .strip > div + div{margin-left:18px;}
  .s20 .strip > div + div::before{content:""; position:absolute; left:-15px; top:50%; margin-top:-5px; border-top:5px solid transparent; border-bottom:5px solid transparent; border-left:8px solid var(--navy);}
  .s20 .strip h4{font-family:var(--disp); font-size:15.5px; font-weight:600; letter-spacing:-.01em;}
  .s20 .strip p{font-family:var(--mono); font-size:11px; letter-spacing:.02em; line-height:1.4; margin-top:3px;}
  .s20 .strip .var{border:2.5px solid var(--red);}
  .s20 .strip .var h4, .s20 .strip .var p{color:var(--red);}

  /* ---------- PRINT: one landscape page per slide ---------- */
  @page{ size:1280px 720px; margin:0; }
  @media print{
    body{background:#fff; display:block;}
    .slide{box-shadow:none; width:1280px; height:720px; page-break-after:always;}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }
</style>
</head>
