<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multi-Page Visually Rich Documents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  /* ================= SHARED CHROME =================
     Identical in every slide file. build.py lifts this block off slide 1, so
     edit it here and it propagates to the deck on the next build.

     A slide carries three things and nothing else: its title, its content, and
     a corner marker giving the slide number and the section. */
  :root{
    --paper:#FFFFFF;
    --ink:#14181C;
    --slate:#14181C;
    --mute:#14181C;
    --line:#E2E6EA;
    --navy:#1F4E79;
    --accent:#1A56B0;
    --wash:#E9EFF5;
    --disp:'Calibri','Carlito',sans-serif;
    --body:'Calibri','Carlito',sans-serif;
    --mono:'Calibri','Carlito',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:#ccd2d8;
    font-family:var(--body); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased; font-variant-ligatures:none;
  }

  /* ---- slide frame: fixed 16:9 ---- */
  .slide{
    width:1280px; height:720px; background:var(--paper);
    position:relative; overflow:hidden;
    display:flex; flex-direction:column;
    padding:56px 64px 62px;
    box-shadow:0 20px 52px rgba(20,24,28,.20);
  }

  h1{
    font-family:var(--disp); font-weight:700; font-style:italic; font-size:42px;
    letter-spacing:0; line-height:1.1;
  }

  /* ---- the content region: everything below the title ---- */
  .body{flex:1; padding-top:34px; min-height:0;}

  /* ---- corner marker: slide number and section ---- */
  .corner{
    position:absolute; right:64px; bottom:26px;
    font-family:var(--mono); font-size:13px; font-weight:400;
    letter-spacing:.03em; color:var(--mute);
  }
  .corner b{color:var(--ink); font-weight:600;}
  .corner span{padding:0 7px;}

  /* ---- highlight colour, annotation boxes, and the section tracker in the corner ---- */
  .hi{color:var(--accent); font-weight:600; font-style:normal;}
  .body b, .body strong{color:var(--accent) !important;}
  .pic{position:relative; flex:none;}
  .pic img{width:100%; height:100%; display:block;}
  .box{position:absolute; border:2.5px solid var(--accent); border-radius:3px;}
  .corner i{font-style:normal; margin-right:14px; opacity:.32;}
  .corner i.on{opacity:1; font-weight:600;}
  .corner i:last-of-type{margin-right:26px;}

  /* ---- gold bars, top left and bottom right ---- */
  .slide::before, .slide::after{content:""; position:absolute; height:11px; width:62%; background:var(--accent);}
  .slide::before{left:0; top:0;}
  .slide::after{right:0; bottom:0;}

  /* ================= SLIDE 44 ================= */
  .s44 .lab{font-family:var(--mono); font-size:14px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; margin-bottom:10px;}
  .s44 .sub{font-family:var(--disp); font-size:27.5px; font-weight:600; letter-spacing:0; line-height:1.25;}
  .s44 ul{list-style:none;}
  .s44 ul li{position:relative; padding-left:26px; margin-bottom:16px; font-size:21.5px; line-height:1.45;}
  .s44 ul li::before{content:""; position:absolute; left:0; top:13px; width:11px; height:2px; background:var(--navy);}
  .s44 ul li:last-child{margin-bottom:0;}
  .s44 b{font-weight:600;}
  .s44 img{display:block;}
  .s44 .fig img{width:1000px; height:auto;}
  .s44 ul{margin-top:34px;}

  /* ---------- PRINT: one landscape page per slide ---------- */
  @page{ size:1280px 720px; margin:0; }
  @media print{
    body{background:#fff; display:block;}
    .slide{box-shadow:none; width:1280px; height:720px; page-break-after:always;}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }
</style>
</head>
